<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vaccinator Location Check-In | EPI Chakwal</title>
<link rel="icon" href="favicon.png.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#e8f5e9 0%,#f0f7f4 40%,#e3f2fd 100%);min-height:100vh;color:#222}
.wrap{max-width:440px;margin:0 auto;padding:16px 14px 40px}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(13,92,61,.12);padding:20px 18px;margin-top:12px}
.brand{text-align:center;padding:8px 0 4px}
.brand img{height:52px;width:52px;object-fit:contain;border-radius:10px}
.brand h1{font-size:18px;color:#0d5c3d;margin:8px 0 2px;font-weight:800}
.brand p{font-size:12px;color:#666;line-height:1.35}
label{display:block;font-size:13px;font-weight:600;color:#0d5c3d;margin:12px 0 5px}
select,input{width:100%;padding:12px 12px;border:1.5px solid #c8e6c9;border-radius:10px;font-size:15px;background:#fafffe}
select:focus,input:focus{outline:none;border-color:#1a8a5c;box-shadow:0 0 0 3px rgba(26,138,92,.15)}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px}
.btn-loc{background:linear-gradient(135deg,#0d5c3d,#1a8a5c);color:#fff}
.btn-loc:disabled{opacity:.55;cursor:not-allowed}
.btn-sub{background:#1565c0;color:#fff}
.btn-sub:disabled{opacity:.55;cursor:not-allowed}
.btn-sec{background:#eceff1;color:#37474f;font-size:14px;padding:10px}
.status{margin-top:12px;padding:12px;border-radius:10px;font-size:13px;line-height:1.45;display:none}
.status.ok{display:block;background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7}
.status.err{display:block;background:#ffebee;color:#b71c1c;border:1px solid #ef9a9a}
.status.info{display:block;background:#e3f2fd;color:#0d47a1;border:1px solid #90caf9}
.loc-box{margin-top:12px;padding:12px;background:#f1f8e9;border-radius:10px;border:1px dashed #81c784;font-size:13px;display:none}
.loc-box strong{color:#0d5c3d}
.foot{text-align:center;margin-top:18px;font-size:11px;color:#78909c}
.note{font-size:12px;color:#666;margin-top:8px;line-height:1.4}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="favicon.png.png" alt="EPI" onerror="this.style.display='none'">
    <h1>Location Check-In</h1>
    <p>EPI District Chakwal · Vaccinator field location<br>Only this page — no other website data</p>
  </div>

  <div class="card">
    <label for="teh">Tehsil</label>
    <select id="teh"><option value="">Loading…</option></select>

    <label for="uc">Union Council (UC)</label>
    <select id="uc" disabled><option value="">Select Tehsil first</option></select>

    <label for="vacc">Vaccinator</label>
    <select id="vacc" disabled><option value="">Select UC first</option></select>

    <p class="note">1) Tehsil → UC → apna naam select karein<br>2) <strong>Get My Location</strong> dabayein (Allow location)<br>3) <strong>Submit Location</strong> dabayein</p>

    <button type="button" class="btn btn-loc" id="btnLoc" onclick="getLocation()">📍 Get My Location</button>
    <div class="loc-box" id="locBox"></div>

    <button type="button" class="btn btn-sub" id="btnSub" onclick="submitLoc()" disabled>✅ Submit Location</button>
    <button type="button" class="btn btn-sec" onclick="resetForm()" style="margin-top:8px">↺ Reset</button>

    <div class="status" id="status"></div>
  </div>

  <div class="foot">
    Official use · EPI Chakwal<br>
    <a href="./" style="color:#0d5c3d">← Main dashboard</a> (staff only)
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ========== CONFIG ========== */
/* Deploy Apps Script (Location_AppsScript.gs) → Web app → Anyone → paste /exec URL below */
const LOC_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzPLACEHOLDER/exec';
const MASTER_SHEET_ID = '1KAuJOL3WuYdp5YA4sD70kofeVkYPP3bJ5Rxro_0MUUc';

let master = []; // {tehsil, uc, name, username}
let lastLoc = null; // {lat, lng, accuracy, maps}

function showStatus(msg, type){
  const el = document.getElementById('status');
  el.className = 'status ' + (type||'info');
  el.textContent = msg;
}

function normUser(u){
  let s = String(u==null?'':u).trim();
  if(s.endsWith('.0')) s = s.slice(0,-2);
  if(/^\d+$/.test(s) && s.length>=10 && !s.startsWith('0')) s = '0'+s;
  return s;
}

async function loadMaster(){
  const teh = document.getElementById('teh');
  try{
    const url = 'https://docs.google.com/spreadsheets/d/'+MASTER_SHEET_ID+'/export?format=xlsx&_='+Date.now();
    const res = await fetch(url);
    if(!res.ok) throw new Error('Sheet load HTTP '+res.status);
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    let sheetName = wb.SheetNames.find(function(n){ return /total\s*vaccinator/i.test(n); }) || wb.SheetNames[0];
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});
    if(!aoa.length) throw new Error('Empty sheet');
    const H = (aoa[0]||[]).map(function(h){ return String(h||'').toLowerCase().trim(); });
    function ix(cands){
      for(let i=0;i<cands.length;i++){
        const j = H.indexOf(cands[i]);
        if(j>=0) return j;
      }
      for(let i=0;i<H.length;i++){
        for(let k=0;k<cands.length;k++){ if(H[i].indexOf(cands[k])>=0) return i; }
      }
      return -1;
    }
    const iT = ix(['tehsil']), iU = ix(['union council','uc']), iN = ix(['vaccinator name','name']), iUser = ix(['username']);
    master = [];
    for(let r=1;r<aoa.length;r++){
      const row = aoa[r]||[];
      const name = iN>=0 ? String(row[iN]||'').trim() : '';
      if(!name) continue;
      master.push({
        tehsil: iT>=0 ? String(row[iT]||'').trim() : '',
        uc: iU>=0 ? String(row[iU]||'').trim() : '',
        name: name,
        username: iUser>=0 ? normUser(row[iUser]) : ''
      });
    }
    const tehsils = {};
    master.forEach(function(m){ if(m.tehsil) tehsils[m.tehsil]=1; });
    teh.innerHTML = '<option value="">— Select Tehsil —</option>' +
      Object.keys(tehsils).sort().map(function(t){ return '<option value="'+t.replace(/"/g,'&quot;')+'">'+t+'</option>'; }).join('');
    showStatus('Vaccinators loaded: '+master.length, 'ok');
  }catch(e){
    console.error(e);
    teh.innerHTML = '<option value="">Load failed</option>';
    showStatus('List load failed: '+(e.message||e)+'. Check sheet sharing (Anyone with link → Viewer).', 'err');
  }
}

function onTehsil(){
  const t = document.getElementById('teh').value;
  const uc = document.getElementById('uc');
  const vacc = document.getElementById('vacc');
  vacc.innerHTML = '<option value="">Select UC first</option>';
  vacc.disabled = true;
  if(!t){
    uc.innerHTML = '<option value="">Select Tehsil first</option>';
    uc.disabled = true;
    return;
  }
  const set = {};
  master.forEach(function(m){ if(m.tehsil===t && m.uc) set[m.uc]=1; });
  uc.disabled = false;
  uc.innerHTML = '<option value="">— Select UC —</option>' +
    Object.keys(set).sort().map(function(u){ return '<option value="'+u.replace(/"/g,'&quot;')+'">'+u+'</option>'; }).join('');
}

function onUC(){
  const t = document.getElementById('teh').value;
  const u = document.getElementById('uc').value;
  const vacc = document.getElementById('vacc');
  if(!t||!u){
    vacc.innerHTML = '<option value="">Select UC first</option>';
    vacc.disabled = true;
    return;
  }
  const list = master.filter(function(m){ return m.tehsil===t && m.uc===u; });
  vacc.disabled = false;
  vacc.innerHTML = '<option value="">— Select Vaccinator —</option>' +
    list.map(function(m,i){
      return '<option value="'+i+'" data-name="'+m.name.replace(/"/g,'&quot;')+'" data-user="'+String(m.username||'').replace(/"/g,'&quot;')+'">'+m.name+(m.username?' ('+m.username+')':'')+'</option>';
    }).join('');
  // store filtered on select options via index into filtered list
  vacc._list = list;
}

function selectedVacc(){
  const vacc = document.getElementById('vacc');
  const list = vacc._list || [];
  const i = vacc.selectedIndex - 1; // skip placeholder
  if(i<0 || i>=list.length) return null;
  return list[i];
}

function getLocation(){
  const v = selectedVacc();
  if(!v){
    showStatus('Pehle Tehsil, UC aur Vaccinator select karein.', 'err');
    return;
  }
  if(!navigator.geolocation){
    showStatus('Is device/browser me location support nahi hai.', 'err');
    return;
  }
  const btn = document.getElementById('btnLoc');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Getting location…';
  showStatus('Location manga ja raha hai — Allow dabayein…', 'info');
  navigator.geolocation.getCurrentPosition(function(pos){
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const acc = pos.coords.accuracy;
    lastLoc = {
      lat: lat,
      lng: lng,
      accuracy: acc,
      maps: 'https://www.google.com/maps?q='+lat+','+lng
    };
    const box = document.getElementById('locBox');
    box.style.display = 'block';
    box.innerHTML = '<strong>Location ready</strong><br>Lat: '+lat.toFixed(6)+'<br>Long: '+lng.toFixed(6)+
      '<br>Accuracy: ~'+Math.round(acc)+' m<br><a href="'+lastLoc.maps+'" target="_blank" rel="noopener">Open in Google Maps</a>';
    document.getElementById('btnSub').disabled = false;
    showStatus('Location mil gayi. Ab Submit Location dabayein.', 'ok');
    btn.disabled = false;
    btn.innerHTML = '📍 Get My Location';
  }, function(err){
    lastLoc = null;
    document.getElementById('btnSub').disabled = true;
    document.getElementById('locBox').style.display = 'none';
    let msg = 'Location nahi mili. ';
    if(err.code===1) msg += 'Permission deny — Settings se Location Allow karein.';
    else if(err.code===2) msg += 'GPS signal nahi — khuley ilaqe me try karein.';
    else if(err.code===3) msg += 'Timeout — dobara try karein.';
    else msg += (err.message||'');
    showStatus(msg, 'err');
    btn.disabled = false;
    btn.innerHTML = '📍 Get My Location';
  }, { enableHighAccuracy:true, timeout:25000, maximumAge:0 });
}

async function submitLoc(){
  const v = selectedVacc();
  if(!v){ showStatus('Vaccinator select karein.', 'err'); return; }
  if(!lastLoc){ showStatus('Pehle Get My Location karein.', 'err'); return; }
  if(!LOC_SCRIPT_URL || LOC_SCRIPT_URL.indexOf('PLACEHOLDER')>=0){
    showStatus('Submit setup pending: Admin ko Apps Script Web App URL lagani hogi (location.html me LOC_SCRIPT_URL). Location mil chuki hai — Maps: '+lastLoc.maps, 'err');
    return;
  }
  const btn = document.getElementById('btnSub');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Submitting…';
  const payload = {
    timestamp: new Date().toISOString(),
    name: v.name,
    username: v.username||'',
    tehsil: v.tehsil,
    uc: v.uc,
    lat: lastLoc.lat,
    lng: lastLoc.lng,
    accuracy: lastLoc.accuracy,
    maps: lastLoc.maps
  };
  try{
    await fetch(LOC_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'text/plain'},
      body: JSON.stringify(payload)
    });
    // no-cors → opaque; assume ok if no throw
    showStatus('Location submit ho gayi. Shukriya, '+v.name+'.', 'ok');
    btn.innerHTML = '✅ Submitted';
  }catch(e){
    showStatus('Submit fail: '+(e.message||e), 'err');
    btn.disabled = false;
    btn.innerHTML = '✅ Submit Location';
  }
}

function resetForm(){
  lastLoc = null;
  document.getElementById('locBox').style.display = 'none';
  document.getElementById('btnSub').disabled = true;
  document.getElementById('btnSub').innerHTML = '✅ Submit Location';
  document.getElementById('teh').value = '';
  onTehsil();
  showStatus('Form reset.', 'info');
}

document.getElementById('teh').addEventListener('change', onTehsil);
document.getElementById('uc').addEventListener('change', onUC);
loadMaster();
</script>
</body>
</html>
